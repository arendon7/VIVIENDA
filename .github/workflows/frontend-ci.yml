name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - implementation/**
      - design/**
      - product/**

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Domain tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Borrower journey E2E
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 3

  remote-preview-e2e:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 31
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      E2E_BASE_URL: https://vivienda-git-brand-casa-con-criterio-v1-nnnn25.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify Vercel Preview identity
        shell: bash
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          status="$(curl --location --silent --show-error \
            --header "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            --dump-header /tmp/vivienda-preview.headers \
            --output /tmp/vivienda-preview.html \
            --write-out '%{http_code}' \
            "$E2E_BASE_URL/" || true)"

          echo "Root HTTP $status"
          echo "=== selected response headers ==="
          grep -E -i '^(content-type|server|x-vercel|x-robots-tag|cache-control|location):' /tmp/vivienda-preview.headers || true

          title="$(tr '\n' ' ' < /tmp/vivienda-preview.html | sed -n 's:.*<title>\([^<]*\)</title>.*:\1:p' | head -n 1)"
          echo "HTML title: ${title:-<none>}"

          if [ "$status" != "200" ]; then
            echo "::error::Preview root did not return HTTP 200."
            exit 1
          fi

          if ! grep -Fq "Casa con Criterio" /tmp/vivienda-preview.html; then
            echo "::error::OIDC request did not reach the Casa con Criterio application identity."
            echo "=== public HTML classification ==="
            if grep -Eqi 'vercel.*(security|authentication|checkpoint|protection)|deployment protection|authentication required|Login – Vercel|Login - Vercel' /tmp/vivienda-preview.html; then
              echo "Vercel Authentication is still intercepting the request. The GitHub OIDC source is not trusted for this project yet."
            elif grep -Fqi "VIVIENDA" /tmp/vivienda-preview.html; then
              echo "Detected VIVIENDA text without the current Casa con Criterio masterbrand; alias may be serving an older build."
            else
              echo "HTML does not match the current application or known Vercel protection markers."
            fi
            echo "=== HTML diagnostic prefix (public response, first 1200 bytes) ==="
            head -c 1200 /tmp/vivienda-preview.html | tr '\n' ' '
            echo
            exit 1
          fi

          manifest_status="$(curl --location --silent --show-error \
            --header "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            --dump-header /tmp/vivienda-manifest.headers \
            --output /tmp/vivienda-manifest.json \
            --write-out '%{http_code}' \
            "$E2E_BASE_URL/manifest.webmanifest" || true)"
          echo "Manifest HTTP $manifest_status"
          grep -E -i '^(content-type|x-vercel|x-robots-tag|cache-control|location):' /tmp/vivienda-manifest.headers || true

          if [ "$manifest_status" != "200" ]; then
            echo "::error::Manifest did not return HTTP 200."
            exit 1
          fi

          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("/tmp/vivienda-manifest.json","utf8")); if(m.name!=="Casa con Criterio") { console.error(`::error::Unexpected manifest identity: ${m.name ?? "<missing>"}`); process.exit(1); } console.log(`Manifest identity: ${m.name}`);'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Remote Preview E2E
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: npm run test:e2e

      - name: Upload remote Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-remote-preview-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
